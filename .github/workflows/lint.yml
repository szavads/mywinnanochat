name: Lint

on:
  push:
    branches: ["windows-cpu-support", "main"]
  pull_request:
    branches: ["windows-cpu-support", "main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (critical errors only)
        run: ruff check --select E9,F63,F7,F82 .
